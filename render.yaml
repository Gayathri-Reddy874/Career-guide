# render.yaml
services:
  - type: web
    name: career-guide-ai
    runtime: python
    repo: https://github.com/chetankumar1530-sudo/career-guide-app
    plan: free
    region: singapore  # or oregon, frankfurt
    buildCommand: |
      pip install --upgrade pip
      pip install -r requirements.txt
    startCommand: gunicorn wsgi:application --bind 0.0.0.0:$PORT --workers 2 --threads 4 --timeout 120
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        value: sqlite:///instance/career_guide.db
      - key: PORT
        value: 10000
    healthCheckPath: /health
    autoDeploy: true